<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบจองเช่าชุด</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f4;--card:#fff;--ink:#2a1a22;--mute:#7d6a73;--line:#eadfe2;--wine:#8a2f55;--wine2:#6e2243;--ok:#2e7d5b;--bad:#b3342f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1217;--card:#27191f;--ink:#f6e9ee;--mute:#b79ba7;--line:#3b2831;--wine:#d0668f;--wine2:#b44f78;--ok:#55c394;--bad:#ff8a84}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Prompt,system-ui,sans-serif}
h1{font-size:20px;margin:0;font-weight:600}h1 small{font-size:12px;color:var(--mute);font-weight:400}.sub{color:var(--mute);font-size:13px}
button{font:inherit;cursor:pointer}
.primary{background:var(--wine);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:500}.primary:disabled{opacity:.4}
.lite{background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:6px 10px;font-size:13px}
.lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lc{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px;width:100%;max-width:400px;text-align:center}
.lc .seg{margin-top:12px}.lc label{text-align:left}
.app{display:flex;min-height:100vh}
aside{width:215px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside h2{margin:0 8px 14px;font-size:18px;color:var(--wine)}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 12px;color:var(--ink);margin-bottom:2px}
.nav button[aria-pressed=true]{background:var(--wine);color:#fff}.nav hr{border:0;border-top:1px solid var(--line);margin:10px 0}
main{flex:1;min-width:0;padding:16px;max-width:900px}
#menu{display:none;margin-bottom:10px}
@media(max-width:700px){aside{position:fixed;left:0;top:0;z-index:8;transform:translateX(-100%);transition:transform .2s}aside.on{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}#menu{display:inline-block}}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.bar{grid-template-columns:1fr}}
.bar label{margin:0}.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 14px}
.tab[aria-pressed=true]{background:var(--wine);color:#fff;border-color:var(--wine)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0;color:inherit}.item.off{opacity:.5}
.pic{aspect-ratio:3/4;position:relative;background:linear-gradient(#f5ece9,#efe3df);display:flex;align-items:center;justify-content:center}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.noimg{color:#a89096;font-size:13px}
.badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px}
.b{background:var(--wine2);color:#fff;font-size:11px;border-radius:10px;padding:1px 8px;width:max-content}
.info{padding:10px 12px}.name{font-weight:600}.code{color:var(--mute);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:end;margin-top:6px;gap:6px}
.price{color:var(--wine);font-weight:600;font-size:17px}.price small{color:var(--mute);font-weight:400;font-size:11px;display:block}
.st{font-size:12px;border-radius:10px;padding:2px 8px}.free{background:#e3f4ec;color:var(--ok)}.busy{background:#fbe6e4;color:var(--bad)}
.zs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.z{font-size:12px;border-radius:8px;padding:0 8px;border:1px solid var(--ok);color:var(--ok)}.z.out{border-color:var(--line);color:var(--mute);text-decoration:line-through}
.bk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.bk.cx{opacity:.55}
.bk h3{margin:0 0 4px;font-size:15px}.bk p{margin:2px 0;color:var(--mute);font-size:13px}.acts{display:flex;gap:8px;margin-top:8px}
.ghost{background:none;border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:8px 12px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:10px}.gal img{flex:none;width:85%;max-height:380px;object-fit:cover;border-radius:12px;scroll-snap-align:center}
.pt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0;text-align:center;font-size:13px}
.pt div{background:var(--bg);border-radius:10px;padding:6px 2px}.pt b{display:block;font-weight:500;color:var(--mute);font-size:12px}.pt span{color:var(--wine);font-weight:600}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg button,.days button{flex:1 1 28%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px}
.seg button[aria-pressed=true],.days button[aria-pressed=true]{background:var(--wine);color:#fff;border-color:var(--wine)}
.seg button:disabled,.days button:disabled{opacity:.3}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sum{background:var(--bg);border-radius:12px;padding:12px;margin-top:14px;font-size:14px}
.sum div{display:flex;justify-content:space-between}.sum .t{font-weight:600;font-size:17px;color:var(--wine);margin-top:6px}
.msg{margin-top:10px;font-size:13px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.x{float:right;background:none;border:0;font-size:24px;color:var(--mute)}
.eph{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.eph .t{aspect-ratio:1;position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.eph img{width:100%;height:100%;object-fit:cover}.eph .t button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:22px;height:22px;line-height:20px;padding:0}
.eph .add{font-size:28px;color:var(--wine);cursor:pointer}
.ok2{text-align:center;padding:10px 0}.ok2 .big{font-size:52px}
</style>
</head>
<body>
<div class="lg" id="login"><div class="lc">
  <h1 id="lgBrand"></h1><div class="sub" style="margin-top:14px">เลือกประเภทการเข้าใช้งาน</div>
  <div class="seg" id="lgRole"><button data-r="cus" aria-pressed="true">👤 ลูกค้า</button><button data-r="own" aria-pressed="false">🏬 เจ้าของร้าน</button></div>
  <label for="lgPw">รหัสเข้าใช้งาน</label><input id="lgPw" type="password" inputmode="numeric" autocomplete="off">
  <div class="msg bad" id="lgMsg"></div>
  <button class="primary" id="lgGo" style="width:100%;margin-top:14px">เข้าสู่ระบบ</button>
</div></div>

<div class="app" id="app" hidden>
  <aside id="side"><h2 class="brand"></h2><nav class="nav" id="nav"></nav></aside>
  <main>
    <button class="lite" id="menu">☰ เมนู</button>
    <div class="sub" id="today"></div>
    <div id="bar"><div class="bar"><label>ดูความว่างวันที่<input type="date" id="vd"></label><label>ค้นหา<input id="q" placeholder="ชื่อหรือรหัสชุด"></label></div><div class="tabs" id="szTabs"></div></div>
    <div id="view"></div>
  </main>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script>
const BRAND='Nuea Brand';
const CATS=['ชุดคาเฟ่','ชุดราตรี'];
const API='https://script.google.com/macros/s/AKfycbyhzR0tO2LS8IOTkJLfcdqp99rUv35vOG6LXEKBja0x55kq7JgJ0iswkThbrmWewsTbCQ/exec';
const SHIP_FEE=60,OUT_MIN=2,OUT_LEAD=2,OUT_BACK=2,IN_BACK=1;
const $=s=>document.querySelector(s);
const dn=s=>{const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)/864e5};
const iso=n=>new Date(n*864e5).toISOString().slice(0,10);
const fmt=n=>new Date(n*864e5).toLocaleDateString('th-TH',{day:'numeric',month:'short',timeZone:'UTC'});
const now=new Date(),loc=new Date(now-now.getTimezoneOffset()*6e4),todayStr=loc.toISOString().slice(0,10),T=dn(todayStr);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let code='',role='cus',loginRole='cus';
const post=(a,d)=>new Promise((res,rej)=>{
  const id='f'+Date.now()+Math.random().toString(36).slice(2),fr=document.createElement('iframe');
  fr.name=id;fr.style.display='none';
  const fm=document.createElement('form');fm.method='POST';fm.action=API;fm.target=id;fm.style.display='none';
  const i=document.createElement('input');i.type='hidden';i.name='payload';i.value=JSON.stringify({a,c:code,...d,_id:id});fm.appendChild(i);
  let t;
  const done=()=>{clearTimeout(t);removeEventListener('message',h);fr.remove();fm.remove()};
  const h=e=>{if(e.data&&e.data.__id===id){done();res(e.data.r)}};
  addEventListener('message',h);
  t=setTimeout(()=>{done();rej('หมดเวลา เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง')},60000);
  document.body.append(fr,fm);fm.submit();
});
let sets=[],busy=[],A={sets:[],orders:[],customers:[]},tab='shop',cat='all',sz='',V=T,f={};
const adm=()=>role==='own';
const ov=(p,q)=>p==='set'||q==='set'||p===q;
const szs=s=>{const a=String(s.sizes||'').split(',').map(x=>x.trim()).filter(Boolean);return a.length?a:['']};
const isBusy=(s,part,size,bs,be)=>busy.some(b=>String(b.setId)===String(s.id)&&ov(b.part,part)&&String(b.size)===size&&b.bs<=be&&b.be>=bs);
const free=(s,z)=>!isBusy(s,'set',z,V,V);
const pics=s=>String(s.photos||s.photo||'').split(',').filter(Boolean);
const th=(id,w)=>'https://drive.google.com/thumbnail?id='+id+'&sz=w'+w;
const ph=s=>pics(s)[0]?th(pics(s)[0],600):'';
const price=(s,part,d)=>part==='set'?(+s['p'+d]||0):(+s.pp||0)*d;
const list=()=>adm()?A.sets:sets;
const cats=()=>[...new Set([...CATS,...list().map(s=>s.cat).filter(Boolean)])];
$('#today').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
document.title=BRAND;document.querySelectorAll('.brand,#lgBrand').forEach(e=>e.textContent=BRAND);
function shrink(file,max){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8).split(',')[1])};i.src=URL.createObjectURL(file)})}

async function enter(r,c){
  const m=$('#lgMsg');m.textContent='กำลังตรวจสอบ...';code=c;
  try{
    if(r==='own'){const x=await post('admin',{});if(x.err)throw x.err;if(!x.orders)throw 'Apps Script ยังเป็นโค้ดเวอร์ชันเก่า ให้วาง Code.gs ใหม่แล้ว Deploy เวอร์ชันใหม่';A=x}
    const x=await post('list',{});if(x.err)throw x.err;if(!x.sets)throw 'Apps Script ยังเป็นโค้ดเวอร์ชันเก่า ให้วาง Code.gs ใหม่แล้ว Deploy เวอร์ชันใหม่';
    sets=x.sets;busy=x.busy;role=r;tab=r==='own'?'ord':'shop';
    try{sessionStorage.setItem('k',JSON.stringify([r,c]))}catch(e){}
    $('#login').hidden=true;$('#app').hidden=false;$('#vd').value=todayStr;$('#vd').min=todayStr;m.textContent='';render();
  }catch(e){code='';m.textContent=typeof e==='string'?e:'เกิดข้อผิดพลาด: '+e}
}
function logout(){try{sessionStorage.removeItem('k')}catch(e){}location.reload()}
async function load(){
  try{const r=await post('list',{});if(r.err)throw r.err;sets=r.sets;busy=r.busy;if(adm()){const a=await post('admin',{});if(!a.err)A=a}}
  catch(e){alert('เชื่อมต่อ Google Sheets ไม่ได้')}
  render();
}

const cardHtml=s=>{const zl=szs(s),any=zl.some(z=>free(s,z));
return `<button class="item${s.active==='Y'?'':' off'}" data-s="${s.id}"><div class="pic">${ph(s)?`<img src="${ph(s)}" alt="">`:'<span class="noimg">ยังไม่มีรูป</span>'}<div class="badges">${s.cat?`<span class="b">${esc(s.cat)}</span>`:''}${s.isNew==='Y'?'<span class="b">ใหม่</span>':''}${s.pin==='Y'?'<span class="b">📌</span>':''}</div></div><div class="info"><div class="name">${esc(s.name)}</div><div class="code">${esc(s.code)}${adm()?' · 👁 '+(+s.views||0):''}</div><div class="zs">${zl.map(z=>`<span class="z${free(s,z)?'':' out'}">${esc(z)||'ฟรีไซส์'}</span>`).join('')}</div><div class="row"><div class="price">฿${s.p1||'-'}<small>ต่อวัน</small></div><span class="st ${any?'free':'busy'}">${any?'ว่าง':'หมด'}</span></div></div></button>`};
const stTxt={wait:'รอตรวจสลิป/ยืนยัน',paid:'ยืนยันรับเงินแล้ว',cancel:'ยกเลิก'};
const tag=n=>n?'<span class="b" style="display:inline-block">ลูกค้าใหม่</span>':'<span class="b" style="display:inline-block;background:#2e7d5b">ลูกค้าเก่า</span>';
function ordersHtml(){const l=[...A.orders].reverse();return l.length?l.map(o=>{const s=A.sets.find(x=>String(x.id)===String(o.setId))||{name:'?',code:''};return `<div class="bk ${o.status==='cancel'?'cx':''}"><h3>${esc(s.name)} (${esc(s.code)}) ${tag(o.newCust==='Y')}</h3><p>${esc(o.name)} · ${esc(o.tel)}</p><p>${o.part==='set'?'ทั้งเซ็ท':o.part==='top'?'ชิ้นบน':'ชิ้นล่าง'} · ไซส์ ${esc(o.size)||'-'} · ${o.area==='out'?'ต่างจังหวัด':'ในจังหวัด'} (${{pickup:'นัดรับ',grab:'Grab',ship:'ส่งพัสดุ'}[o.method]})</p>${o.address?`<p>ที่อยู่: ${esc(o.address)}</p>`:''}<p>ใช้งาน ${fmt(o.start)} (${o.days} วัน) · คืน ${fmt(o.be)} · ฿${o.total}</p><p>จองเมื่อ ${new Date(o.created).toLocaleString('th-TH')}${o.paytime?' · โอนเมื่อ '+esc(String(o.paytime).replace('T',' ')):''}</p>${o.slip?`<p><a href="https://drive.google.com/file/d/${o.slip}/view" target="_blank" rel="noopener">ดูสลิป</a></p>`:'<p>ยังไม่มีสลิป</p>'}<p><b>${stTxt[o.status]||o.status}</b></p>${o.status!=='cancel'?`<div class="acts">${o.status!=='paid'?`<button class="primary" data-o="${o.id}" data-v="paid">ยืนยันรับเงิน</button>`:''}<button class="ghost" data-o="${o.id}" data-v="cancel">ยกเลิก</button></div>`:''}</div>`}).join(''):'<div class="empty">ยังไม่มีออเดอร์</div>'}
const custHtml=()=>A.customers.length?A.customers.map(c=>`<div class="bk"><h3>${esc(c.name)} ${tag((+c.count)<=1)}</h3><p>โทร ${esc(c.tel)} · จอง ${c.count} ครั้ง · รวม ฿${c.total}</p></div>`).join(''):'<div class="empty">ยังไม่มีลูกค้า</div>';

function render(){
  const nav=[['shop','all','🛍 ทั้งหมด'],...cats().map(c=>['shop',c,'👗 '+c])];
  if(adm())nav.push(['-'],['ord','','📋 ออเดอร์'],['cus','','👥 ลูกค้า']);
  nav.push(['-'],['out','','ออกจากระบบ']);
  $('#nav').innerHTML=nav.map(n=>n[0]==='-'?'<hr>':`<button data-t="${n[0]}" data-c="${esc(n[1])}" aria-pressed="${n[0]===tab&&(tab!=='shop'||n[1]===cat)}">${esc(n[2])}</button>`).join('');
  const shop=tab==='shop';$('#bar').hidden=!shop;
  const allSz=[...new Set(list().flatMap(szs).filter(Boolean))];
  $('#szTabs').innerHTML=['',...allSz].map(z=>`<button class="tab" data-z="${esc(z)}" aria-pressed="${sz===z}">${z?'ไซส์ '+esc(z):'ทุกไซส์'}</button>`).join('');
  const v=$('#view');
  if(tab==='ord')return v.innerHTML=ordersHtml();
  if(tab==='cus')return v.innerHTML=custHtml();
  let l=list().filter(s=>cat==='all'||s.cat===cat);
  const k=$('#q').value.trim().toLowerCase();
  if(k)l=l.filter(s=>(s.name+' '+s.code).toLowerCase().includes(k));
  if(sz)l=l.filter(s=>szs(s).includes(sz)&&free(s,sz));
  l.sort((a,b)=>(b.pin==='Y')-(a.pin==='Y'));
  v.innerHTML=(adm()?'<button class="primary" id="addSet" style="margin-bottom:10px">+ เพิ่มชุด</button>':'')+'<div class="grid">'+l.map(cardHtml).join('')+'</div>'+(l.length?'':'<div class="empty">ไม่พบชุดที่ว่างตามที่เลือก</div>');
}

function openSet(id){
  const s=sets.find(x=>String(x.id)===String(id));if(!s)return;
  s.views=(+s.views||0)+1;post('view',{id}).catch(()=>{});
  const fz=szs(s).find(z=>free(s,z));
  f={s,part:'set',size:fz!==undefined?fz:szs(s)[0],area:'in',method:'pickup',days:1};
  $('#sheet').innerHTML=`<button class="x" id="close" aria-label="ปิด">×</button>${pics(s).length?`<div class="gal">${pics(s).map(i=>`<img src="${th(i,800)}" alt="">`).join('')}</div>`:''}
  <h1>${esc(s.name)} <small>${esc(s.code)}${s.cat?' · '+esc(s.cat):''}</small></h1>
  <div class="pt">${[1,2,3,4,5].map(d=>`<div><b>${d} วัน</b><span>฿${s['p'+d]||'-'}</span></div>`).join('')}</div>
  <label>เช่าแบบ</label><div class="seg"><button data-k="part" data-v="set">ทั้งเซ็ท</button>${+s.pp>0?`<button data-k="part" data-v="top">ชิ้นบน ฿${s.pp}/วัน</button><button data-k="part" data-v="bottom">ชิ้นล่าง ฿${s.pp}/วัน</button>`:''}</div>
  <label>ไซส์</label><div class="seg" id="gSize"></div>
  <label>พื้นที่</label><div class="seg"><button data-k="area" data-v="in">ในจังหวัด</button><button data-k="area" data-v="out">ต่างจังหวัด</button></div>
  <label>การรับชุด</label><div class="seg" id="gMeth"></div>
  <div id="addrBox"><label for="fAddr">ที่อยู่</label><textarea id="fAddr" rows="2"></textarea></div>
  <label for="fDate">วันใช้งานชุด</label><input type="date" id="fDate">
  <label>จำนวนวันเช่า</label><div class="days" id="days"></div>
  <label for="fTel">เบอร์โทร (10 หลัก)</label><input id="fTel" inputmode="numeric" maxlength="10" placeholder="0812345678"><div class="sub" id="cust"></div>
  <label for="fName">ชื่อลูกค้า</label><input id="fName">
  <label for="fSlip">แนบสลิปโอนเงิน</label><input id="fSlip" type="file" accept="image/*">
  <label for="fPay">โอนเงินเมื่อวันและเวลา</label><input id="fPay" type="datetime-local">
  <div class="sum" id="sum"></div><div class="msg" id="msg"></div>
  <button class="primary" id="save" style="width:100%;margin-top:14px">ยืนยันการจอง</button>`;
  $('#fDate').min=todayStr;$('#fDate').value=iso(Math.max(V,T));$('#fPay').value=loc.toISOString().slice(0,16);
  $('#ov').classList.add('on');calc();
}
function calc(){
  const s=f.s;if(!s)return;
  const out=f.area==='out',min=out?OUT_MIN:1;if(f.days<min)f.days=min;
  f.method=out?'ship':(f.method==='ship'?'pickup':f.method);
  const ds=$('#fDate').value,st=ds?dn(ds):0,bs=st-(out?OUT_LEAD:0),be=st+f.days-1+(out?OUT_BACK:IN_BACK);
  $('#gMeth').innerHTML=(out?[['ship','จัดส่งพัสดุ']]:[['pickup','นัดรับที่ร้าน'],['grab','ส่งผ่าน Grab']]).map(m=>`<button data-k="method" data-v="${m[0]}">${m[1]}</button>`).join('');
  if(ds&&isBusy(s,f.part,f.size,bs,be)){const o=szs(s).find(z=>!isBusy(s,f.part,z,bs,be));if(o!==undefined)f.size=o}
  $('#gSize').innerHTML=szs(s).map(z=>{const b=ds&&isBusy(s,f.part,z,bs,be);return `<button data-k="size" data-v="${esc(z)}" ${b?'disabled':''}>${esc(z)||'ฟรีไซส์'}${b?' (หมด)':''}</button>`}).join('');
  $('#days').innerHTML=[1,2,3,4,5].map(d=>`<button data-d="${d}" aria-pressed="${d===f.days}" ${d<min?'disabled':''}>${d}</button>`).join('');
  document.querySelectorAll('#sheet [data-k]').forEach(b=>b.setAttribute('aria-pressed',String(f[b.dataset.k])===b.dataset.v));
  $('#addrBox').style.display=f.method==='pickup'?'none':'block';
  const pr=price(s,f.part,f.days),ship=out?SHIP_FEE:0,total=pr+ship;
  $('#sum').innerHTML=`<div><span>ค่าเช่า ${f.days} วัน</span><span>฿${pr}</span></div>`+(ship?`<div><span>ค่าจัดส่ง</span><span>฿${ship}</span></div>`:'')+(f.method==='grab'?'<div><span>ค่า Grab</span><span>จ่ายตามจริง</span></div>':'')+`<div><span>คืนชุดภายใน</span><span>${ds?fmt(be):'-'}</span></div><div class="t"><span>รวม</span><span>฿${total}</span></div>`;
  let err='';
  if(!ds)err='เลือกวันใช้งาน';else if(st<T)err='เลือกวันย้อนหลังไม่ได้';else if(bs<T)err='ต่างจังหวัดต้องจองล่วงหน้าอย่างน้อย '+OUT_LEAD+' วัน';
  else if(!pr)err='ชุดนี้ยังไม่ได้ตั้งราคาสำหรับแบบที่เลือก';else if(isBusy(s,f.part,f.size,bs,be))err='ไม่ว่างในช่วงที่เลือก ลองเปลี่ยนวันหรือไซส์';
  f.o={setId:s.id,part:f.part,size:f.size,area:f.area,method:f.method,start:st,days:f.days,bs,be,total};
  const m=$('#msg');m.className='msg '+(err?'bad':'ok');m.textContent=err||'ว่าง จองได้';$('#save').disabled=!!err;
}
async function submit(){
  const o={...f.o,name:$('#fName').value.trim(),tel:$('#fTel').value.trim(),address:$('#fAddr').value.trim(),paytime:$('#fPay').value},m=$('#msg'),file=$('#fSlip').files[0];
  const bad=t=>{m.className='msg bad';m.textContent=t};
  if(!o.name)return bad('กรอกชื่อลูกค้า');
  if(!/^\d{10}$/.test(o.tel))return bad('เบอร์โทรต้องเป็นตัวเลข 10 หลัก');
  if(o.method!=='pickup'&&!o.address)return bad('กรอกที่อยู่');
  if(o.area==='out'&&!file)return bad('ต่างจังหวัดต้องแนบสลิป');
  if(file&&!o.paytime)return bad('ระบุวันและเวลาที่โอนเงิน');
  if(!file)o.paytime='';
  $('#save').disabled=true;m.className='msg';m.textContent='กำลังส่ง...';
  try{const r=await post('book',{o,slip:file?await shrink(file,1000):''});
    if(r.err){bad(r.err);$('#save').disabled=false;return}
    const s=f.s;
    $('#sheet').innerHTML=`<button class="x" id="close">×</button><div class="ok2"><div class="big">✅</div><h1>ยืนยันการจองเสร็จสิ้น</h1><p class="sub">${esc(s.name)} (${esc(s.code)}) · ไซส์ ${esc(o.size)||'ฟรีไซส์'}<br>ใช้งาน ${fmt(o.start)} · คืน ${fmt(o.be)} · ฿${o.total}</p><p>ร้านได้รับออเดอร์แล้ว${file?' และจะตรวจสลิปแล้วติดต่อกลับ':' กรุณาชำระเงินตามที่ร้านแจ้ง'}</p><button class="primary" id="close2">ปิด</button></div>`;load();
  }catch(e){bad(typeof e==='string'?e:'ส่งไม่สำเร็จ ลองใหม่อีกครั้ง');$('#save').disabled=false}
}
function renderPh(){$('#eph').innerHTML=f.ids.map((id,i)=>`<div class="t"><img src="${th(id,200)}" alt=""><button data-rm="i${i}">×</button></div>`).join('')+f.files.map((x,i)=>`<div class="t"><img src="${x.u}" alt=""><button data-rm="n${i}">×</button></div>`).join('')+'<button class="t add" id="addPh">+</button>'}
function openEdit(id){
  const s=id?A.sets.find(x=>String(x.id)===String(id)):{active:'Y',sizes:'S,M',isNew:'Y'};
  f={e:{...s},ids:pics(s),files:[]};
  const ck=(i,v,t)=>`<label><input type="checkbox" id="${i}" ${v?'checked':''} style="width:auto"> ${t}</label>`;
  $('#sheet').innerHTML=`<button class="x" id="close">×</button><h1>${id?'แก้ไขชุด':'เพิ่มชุด'}</h1>
  <label>ชื่อชุด</label><input id="eName" value="${esc(s.name)}"><label>รหัสชุด</label><input id="eCode" value="${esc(s.code)}">
  <label>หมวดหมู่ (เลือกหรือพิมพ์ใหม่)</label><input id="eCat" list="catL" value="${esc(s.cat)}"><datalist id="catL">${cats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <label>รูปชุด (กด + เพิ่มได้หลายรูป)</label><div class="eph" id="eph"></div><input id="ePhoto" type="file" accept="image/*" multiple hidden>
  <label>ราคารวมตามจำนวนวัน (บาท) 1-5 วัน</label><div class="days">${[1,2,3,4,5].map(d=>`<input type="number" id="eP${d}" value="${s['p'+d]==null?'':s['p'+d]}" placeholder="${d}">`).join('')}</div>
  <label>ราคาเช่าแยกชิ้นต่อวัน (ว่าง = ไม่ให้เช่าแยก)</label><input id="ePp" type="number" value="${s.pp||''}">
  <label>ไซส์ที่มี (คั่นด้วยจุลภาค เช่น S,M)</label><input id="eSz" value="${esc(s.sizes)}">
  <label>ต้นทุนชุด (บาท)</label><input id="eCost" type="number" value="${s.cost||''}">
  ${ck('eNew',s.isNew==='Y','ป้าย "ใหม่"')}${ck('ePin',s.pin==='Y','ปักหมุด (สูงสุด 6 ชุด)')}${ck('eAct',s.active==='Y','แสดงในร้าน')}
  <div class="msg" id="msg"></div><button class="primary" id="eSave" style="width:100%;margin-top:14px">บันทึก</button>`;
  renderPh();$('#ov').classList.add('on');
}
async function saveEdit(){
  const s=f.e,g=i=>$('#'+i).value.trim();
  Object.assign(s,{name:g('eName'),code:g('eCode'),cat:g('eCat'),pp:g('ePp'),sizes:g('eSz'),cost:g('eCost'),isNew:$('#eNew').checked?'Y':'',pin:$('#ePin').checked?'Y':'',active:$('#eAct').checked?'Y':''});
  [1,2,3,4,5].forEach(d=>s['p'+d]=g('eP'+d));
  const m=$('#msg');if(!s.name||!s.code){m.className='msg bad';m.textContent='กรอกชื่อและรหัสชุด';return}
  $('#eSave').disabled=true;m.className='msg';
  try{
    for(let i=0;i<f.files.length;i++){m.textContent=`กำลังอัปโหลดรูป ${i+1}/${f.files.length}...`;const r=await post('upload',{img:await shrink(f.files[i].file,900)});if(r.err)throw r.err;f.ids.push(r.id)}
    f.files=[];s.photos=f.ids.join(',');m.textContent='กำลังบันทึก...';
    const r=await post('saveSet',{set:s});
    if(r.err){m.className='msg bad';m.textContent=r.err;$('#eSave').disabled=false;return}
    $('#ov').classList.remove('on');await load();
  }catch(e){m.className='msg bad';m.textContent=typeof e==='string'?e:'บันทึกไม่สำเร็จ';$('#eSave').disabled=false}
}
document.addEventListener('click',async e=>{
  const t=e.target;
  const lr=t.closest('#lgRole [data-r]');if(lr){loginRole=lr.dataset.r;document.querySelectorAll('#lgRole button').forEach(b=>b.setAttribute('aria-pressed',String(b===lr)));return}
  if(t.closest('#lgGo'))return enter(loginRole,$('#lgPw').value.trim());
  if(t.closest('#menu'))return $('#side').classList.toggle('on');
  const n=t.closest('#nav [data-t]');if(n){if(n.dataset.t==='out')return logout();tab=n.dataset.t;if(tab==='shop')cat=n.dataset.c;$('#side').classList.remove('on');return render()}
  const zt=t.closest('[data-z]');if(zt){sz=zt.dataset.z;return render()}
  if(t.closest('#close')||t.closest('#close2')||t.id==='ov')return $('#ov').classList.remove('on');
  if(t.closest('#addSet'))return openEdit(null);
  const c=t.closest('#view [data-s]');if(c)return adm()?openEdit(c.dataset.s):openSet(c.dataset.s);
  const od=t.closest('[data-o]');if(od){await post('status',{id:od.dataset.o,status:od.dataset.v});return load()}
  if(t.closest('#addPh'))return $('#ePhoto').click();
  const rm=t.closest('[data-rm]');if(rm){const i=+rm.dataset.rm.slice(1);rm.dataset.rm[0]==='i'?f.ids.splice(i,1):f.files.splice(i,1);return renderPh()}
  const k=t.closest('#sheet [data-k]');if(k&&!k.disabled){f[k.dataset.k]=k.dataset.v;return calc()}
  const d=t.closest('#days [data-d]');if(d&&!d.disabled){f.days=+d.dataset.d;return calc()}
  if(t.closest('#save'))return submit();
  if(t.closest('#eSave'))return saveEdit();
});
$('#sheet').addEventListener('change',async e=>{
  if(e.target.id==='fDate')calc();
  if(e.target.id==='ePhoto'){[...e.target.files].forEach(x=>f.files.push({file:x,u:URL.createObjectURL(x)}));e.target.value='';renderPh()}
  if(e.target.id==='fTel'&&/^\d{10}$/.test(e.target.value.trim())){try{const r=await post('lookup',{tel:e.target.value.trim()});$('#cust').textContent=r.name?'ลูกค้าเก่า: '+r.name:'ลูกค้าใหม่';if(r.name&&!$('#fName').value)$('#fName').value=r.name}catch(x){}}
});
$('#sheet').addEventListener('input',e=>{if(e.target.id==='fTel')e.target.value=e.target.value.replace(/\D/g,'').slice(0,10)});
$('#lgPw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lgGo').click()});
$('#q').oninput=render;
$('#vd').onchange=e=>{V=e.target.value?dn(e.target.value):T;render()};
try{const k=JSON.parse(sessionStorage.getItem('k'));if(k)enter(k[0],k[1])}catch(e){}
</script>
</body>
</html>
