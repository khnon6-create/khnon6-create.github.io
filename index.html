<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบจองเช่าชุด</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f4;--card:#fff;--ink:#2a1a22;--mute:#7d6a73;--line:#eadfe2;--wine:#8a2f55;--wine2:#6e2243;--ok:#2e7d5b;--bad:#b3342f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1217;--card:#27191f;--ink:#f6e9ee;--mute:#b79ba7;--line:#3b2831;--wine:#d0668f;--wine2:#b44f78;--ok:#55c394;--bad:#ff8a84}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Prompt,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.layout{display:flex;min-height:100vh}
aside{width:230px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
main{flex:1;min-width:0}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.brand{font-size:20px;font-weight:600;color:var(--wine);padding:4px 8px 12px}
.nh{font-size:12px;color:var(--mute);margin:14px 8px 4px}
.nv{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:9px 10px;border-radius:10px}
.nv small{color:var(--mute)}
.nv[aria-pressed=true]{background:var(--wine);color:#fff}.nv[aria-pressed=true] small{color:#fff}
#menuBtn{display:none}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:380px}
.lbox .brand{text-align:center;font-size:26px}.lbox p{text-align:center;margin:0 0 12px}
#ownerBar{display:none;margin:12px 0 0;padding:12px;border:2px solid var(--wine);border-radius:14px;background:var(--card)}
#ownerBar b{display:block;margin-bottom:8px;color:var(--wine)}
#ownerBar .r{display:flex;gap:8px;flex-wrap:wrap}#ownerBar .r button{flex:1 1 30%}
#ownerBar .big{width:100%;font-size:17px;padding:14px;margin-bottom:8px}
#fab{display:none;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:30px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.qrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:19}
@media(max-width:759px){
 aside{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:20;transform:translateX(-100%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
 aside.on{transform:none}#scrim.on{display:block}#menuBtn{display:inline-block}
}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hl{display:flex;align-items:center;gap:10px}
h1{font-size:20px;margin:0;font-weight:600}h1 small{font-size:12px;color:var(--mute);font-weight:400}.sub{color:var(--mute);font-size:13px}
.primary{background:var(--wine);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:500}.primary:disabled{opacity:.4}
.lite{background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:6px 10px;font-size:13px}
#q{margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0;color:inherit}.item.off{opacity:.5}
.pic{aspect-ratio:3/4;position:relative;background:linear-gradient(#f5ece9,#efe3df);display:flex;align-items:center;justify-content:center}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.noimg{color:#a89096;font-size:13px}
.badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px}
.cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:10px;padding:1px 8px}
.b{background:var(--wine2);color:#fff;font-size:11px;border-radius:10px;padding:1px 8px;width:max-content}
.info{padding:10px 12px}.name{font-weight:600}.code{color:var(--mute);font-size:12px}
.szs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sz{font-size:12px;border:1px solid var(--ok);color:var(--ok);border-radius:8px;padding:0 8px}
.sz.out{border-color:var(--line);color:var(--mute);text-decoration:line-through;opacity:.7}
.row{display:flex;justify-content:space-between;align-items:end;margin-top:6px}
.price{color:var(--wine);font-weight:600;font-size:17px}.price small{color:var(--mute);font-weight:400;font-size:11px;display:block}
.st{font-size:12px;border-radius:10px;padding:2px 8px}.free{background:#e3f4ec;color:var(--ok)}.busy{background:#fbe6e4;color:var(--bad)}
.bk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.bk.cx{opacity:.55}
.bk h3{margin:0 0 4px;font-size:15px}.bk p{margin:2px 0;color:var(--mute);font-size:13px}.acts{display:flex;gap:8px;margin-top:8px}
.ghost{background:none;border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:8px 12px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin-bottom:6px}
.gal img{flex:none;width:100%;max-height:380px;object-fit:cover;border-radius:12px;scroll-snap-align:center}
.gh{font-size:12px;color:var(--mute);margin-bottom:8px;text-align:center}
.pt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0;text-align:center;font-size:13px}
.pt div{background:var(--bg);border-radius:10px;padding:6px 2px}.pt b{display:block;font-weight:500;color:var(--mute);font-size:12px}.pt span{color:var(--wine);font-weight:600}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg button,.days button{flex:1 1 28%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px}
.seg button[aria-pressed=true],.days button[aria-pressed=true]{background:var(--wine);color:#fff;border-color:var(--wine)}
.seg button:disabled,.days button:disabled{opacity:.3}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sum{background:var(--bg);border-radius:12px;padding:12px;margin-top:14px;font-size:14px}
.sum div{display:flex;justify-content:space-between}.sum .t{font-weight:600;font-size:17px;color:var(--wine);margin-top:6px}
.msg{margin-top:10px;font-size:13px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.x{float:right;background:none;border:0;font-size:24px;color:var(--mute)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.pth{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.pth img{width:100%;height:100%;object-fit:cover}
.pth button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;line-height:1;padding:0}
.pth i{position:absolute;left:3px;bottom:3px;background:var(--wine);color:#fff;font-size:10px;font-style:normal;border-radius:6px;padding:0 5px}
.padd{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--mute);cursor:pointer;margin:0}
.padd input{display:none}
.done{text-align:center;padding:20px 0}.done .ic{font-size:54px}
</style>
</head>
<body>
<div class="layout">
  <aside id="side"></aside>
  <main><div class="wrap">
    <header>
      <div class="hl"><button class="lite" id="menuBtn" aria-label="เมนู">☰ เมนู</button><div><h1 id="title"></h1><div class="sub" id="today"></div></div></div>
      <button class="lite" id="admBtn">เจ้าของร้าน</button>
    </header>
    <div id="ownerBar"></div>
    <input id="q" placeholder="ค้นหาชื่อหรือรหัสชุด">
    <div id="view"></div>
    <div class="sub" style="text-align:center;margin:24px 0 8px">เวอร์ชัน 7 · 11 ต.ค. 2569</div>
  </div></main>
</div>
<div id="login"><div class="lbox"><div class="brand" id="lbrand"></div><p class="sub">เลือกประเภทการเข้าใช้งาน</p>
  <div class="seg"><button data-role="cust">👤 ลูกค้า</button><button data-role="owner">🏪 เจ้าของร้าน</button></div>
  <label for="lcode">รหัสเข้าใช้งาน</label><input id="lcode" type="password" inputmode="numeric" autocomplete="off">
  <div class="msg bad" id="lmsg"></div><button class="primary" id="lgo" style="width:100%;margin-top:14px">เข้าสู่ระบบ</button></div></div>
<div id="scrim"></div>
<button class="primary" id="fab" data-add>+ เพิ่มสินค้าใหม่</button>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwX5GXdSZOHyunymQqALuhPFLjzwjyPS1GuQbE4PyC2fydYnGneB-y9Xm0xGQT2USkMaA/exec';
const BRAND='Nuea Brand';                             // <<< ชื่อแบรนด์/ร้าน แก้ตรงนี้ได้
const CATS=['ชุดคาเฟ่','ชุดราตรี','ชุดไทย','ชุดทำงาน','อื่นๆ']; // <<< แก้หมวดหมู่ได้ตามต้องการ
const SHIP_FEE=60,OUT_MIN=2,OUT_LEAD=2,OUT_BACK=2,IN_BACK=1;
const $=s=>document.querySelector(s);
const dn=s=>{const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)/864e5};
const iso=n=>new Date(n*864e5).toISOString().slice(0,10);
const fmt=n=>new Date(n*864e5).toLocaleDateString('th-TH',{day:'numeric',month:'short',timeZone:'UTC'});
const now=new Date(),todayStr=new Date(now-now.getTimezoneOffset()*6e4).toISOString().slice(0,10),T=dn(todayStr);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post=(a,d)=>fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({a,code:sess&&sess.code,...d})}).then(r=>r.json());
let sess=null,loginRole='cust',sets=[],busy=[],adm=null,A={sets:[],orders:[],customers:[]},view='sets',cat='all',sz='all',f={};
const ov=(p,q)=>p==='set'||q==='set'||p===q;
const szs=s=>{const a=String(s.sizes||'').split(',').map(x=>x.trim()).filter(Boolean);return a.length?a:['']};
const qmap=s=>{const m={};String(s.qty||'').split(',').forEach(p=>{const i=p.lastIndexOf(':');if(i>0&&+p.slice(i+1)>0)m[p.slice(0,i).trim()]=+p.slice(i+1)});return m};
const qOf=(s,z)=>qmap(s)[z]||1;
const isBusy=(s,part,size,bs,be)=>busy.filter(b=>String(b.setId)===String(s.id)&&ov(b.part,part)&&String(b.size)===size&&b.bs<=be&&b.be>=bs).length>=qOf(s,size);
const pics=s=>String(s.photo||'').split(',').map(x=>x.trim()).filter(Boolean);
const thumb=(id,w)=>'https://drive.google.com/thumbnail?id='+id+'&sz=w'+(w||600);
const freeSizes=s=>szs(s).filter(z=>!isBusy(s,'set',z,T,T));
const left=(s,z)=>Math.max(0,qOf(s,z)-busy.filter(b=>String(b.setId)===String(s.id)&&String(b.size)===z&&b.bs<=T&&b.be>=T).length);
const total=s=>szs(s).reduce((a,z)=>a+qOf(s,z),0),leftAll=s=>szs(s).reduce((a,z)=>a+left(s,z),0);
const price=(s,part,d)=>part==='set'?(+s['p'+d]||0):(+s.pp||0)*d;
const list=()=>adm?A.sets:sets;
$('#today').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function shrink(file,max){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8).split(',')[1])};i.src=URL.createObjectURL(file)})}
async function load(){try{const r=await post('list',{});if(r.err)throw new Error(r.err);sets=r.sets;busy=r.busy}catch(e){alert('เชื่อมต่อ Google Sheets ไม่ได้')}if(adm)await loadAdmin();render()}
async function loadAdmin(){const r=await post('admin',{pin:adm});if(r.err){alert(r.err);adm=null;return}A=r}

const cardHtml=s=>{const fr=freeSizes(s).length,ps=pics(s);
return `<button class="item${s.active==='Y'?'':' off'}" data-s="${s.id}"><div class="pic">${ps.length?`<img src="${thumb(ps[0])}" alt="" loading="lazy">`:'<span class="noimg">ยังไม่มีรูป</span>'}<div class="badges"><span class="b">เซ็ท</span>${s.isNew==='Y'?'<span class="b">ใหม่</span>':''}${s.pin==='Y'?'<span class="b">📌</span>':''}</div>${ps.length>1?`<span class="cnt">📷 ${ps.length}</span>`:''}</div><div class="info"><div class="name">${esc(s.name)}</div><div class="code">${esc(s.code)}${s.cat?' · '+esc(s.cat):''} · 👁 ${+s.views||0}</div>${s.brand?`<div class="code">แบรนด์ ${esc(s.brand)}</div>`:''}<div class="code">มีทั้งหมด ${total(s)} ชุด · ว่างวันนี้ ${leftAll(s)} ชุด</div><div class="szs">${szs(s).map(z=>`<span class="sz${isBusy(s,'set',z,T,T)?' out':''}">${esc(z)||'ฟรีไซส์'}${qOf(s,z)>1?' '+left(s,z)+'/'+qOf(s,z):''}</span>`).join('')}</div><div class="row"><div class="price">฿${s.p1||'-'}<small>ต่อวัน</small></div><span class="st ${fr?'free':'busy'}">${fr?'ว่างวันนี้':'ไม่ว่างวันนี้'}</span></div></div></button>`};
const stTxt={wait:'รอตรวจสลิป/ยืนยัน',paid:'ยืนยันรับเงินแล้ว',cancel:'ยกเลิก'};
const tag=n=>n?'<span class="b" style="display:inline-block">ลูกค้าใหม่</span>':'<span class="b" style="display:inline-block;background:#2e7d5b">ลูกค้าเก่า</span>';
const pt=v=>{v=String(v||'');return /^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(v)?v.slice(8,10)+'/'+v.slice(5,7)+'/'+v.slice(0,4)+' '+v.slice(11,16):v};
function ordersHtml(){const l=[...A.orders].reverse();return l.length?l.map(o=>{const s=A.sets.find(x=>String(x.id)===String(o.setId))||{name:'?',code:''};return `<div class="bk ${o.status==='cancel'?'cx':''}"><h3>${esc(s.name)} (${esc(s.code)}) ${tag(o.newCust==='Y')}</h3><p>${esc(o.name)} · ${esc(o.tel)}</p><p>${o.part==='set'?'ทั้งเซ็ท':o.part==='top'?'ชิ้นบน':'ชิ้นล่าง'} · ไซส์ ${esc(o.size)||'-'} · ${o.area==='out'?'ต่างจังหวัด':'ในจังหวัด'} (${{pickup:'นัดรับ',grab:'Grab',ship:'ส่งพัสดุ'}[o.method]})</p>${o.address?`<p>ที่อยู่: ${esc(o.address)}</p>`:''}<p>ใช้งาน ${fmt(o.start)} (${o.days} วัน) · คืน ${fmt(o.be)} · ฿${o.total}</p>${o.paytime?`<p>โอนเมื่อ: ${esc(pt(o.paytime))}</p>`:''}${o.slip?`<p><a href="https://drive.google.com/file/d/${o.slip}/view" target="_blank" rel="noopener">ดูสลิป</a></p>`:'<p>ยังไม่มีสลิป</p>'}<p><b>${stTxt[o.status]||o.status}</b></p>${o.status!=='cancel'?`<div class="acts">${o.status!=='paid'?`<button class="primary" data-o="${o.id}" data-v="paid">ยืนยันรับเงิน</button>`:''}<button class="ghost" data-o="${o.id}" data-v="cancel">ยกเลิก</button></div>`:''}</div>`}).join(''):'<div class="empty">ยังไม่มีออเดอร์</div>'}
const custHtml=()=>A.customers.length?A.customers.map(c=>`<div class="bk"><h3>${esc(c.name)} ${tag((+c.count)<=1)}</h3><p>โทร ${esc(c.tel)} · จอง ${c.count} ครั้ง · รวม ฿${c.total}</p></div>`).join(''):'<div class="empty">ยังไม่มีลูกค้า</div>';

function sideHtml(){
  const L=list(),nv=(a,k,v,t,n)=>`<button class="nv" ${a}="${k}" aria-pressed="${v}"><span>${t}</span>${n==null?'':`<small>${n}</small>`}</button>`;
  const allSz=[...new Set(L.flatMap(s=>szs(s)).filter(Boolean))];
  const cnt=c=>L.filter(s=>c==='all'||(s.cat||'')===c).length;
  const used=[...new Set(L.map(s=>s.cat).filter(Boolean))].filter(c=>!CATS.includes(c));
  return `<div class="brand">${esc(BRAND)}</div>${adm?'<button class="primary" data-add style="width:100%;margin:0 0 6px">+ เพิ่มสินค้าใหม่</button>':''}
  <div class="nh">เมนู</div>${nv('data-n','sets',view==='sets','ชุดทั้งหมด')}${nv('data-n','free',view==='free','ว่างวันนี้')}${adm?nv('data-n','ord',view==='ord','ออเดอร์',A.orders.filter(o=>o.status==='wait').length||'')+nv('data-n','cus',view==='cus','ลูกค้า'):''}
  <div class="nh">หมวดหมู่</div>${nv('data-c','all',cat==='all','ทั้งหมด',cnt('all'))}${[...CATS,...used].map(c=>nv('data-c',esc(c),cat===c,esc(c),cnt(c))).join('')}
  <div class="nh">ไซส์ที่ว่างวันนี้</div>${nv('data-z','all',sz==='all','ทุกไซส์')}${allSz.map(z=>nv('data-z',esc(z),sz===z,esc(z))).join('')}`;
}
function render(){
  $('#side').innerHTML=sideHtml();
  $('#admBtn').textContent='ออกจากระบบ'+(adm?' (เจ้าของร้าน)':'');
  $('#title').textContent=BRAND;$('#fab').style.display=adm?'block':'none';
  const ob=$('#ownerBar');ob.style.display=adm?'block':'none';
  ob.innerHTML=adm?`<b>โหมดเจ้าของร้าน</b><button class="primary big" data-add>+ เพิ่มสินค้าใหม่</button><div class="r"><button class="lite" data-n="sets">สินค้าทั้งหมด</button><button class="lite" data-n="ord">ออเดอร์</button><button class="lite" data-n="cus">ลูกค้า</button></div>`:'';
  const lst=view==='sets'||view==='free';
  $('#q').style.display=lst?'block':'none';
  const v=$('#view');
  if(view==='ord'){v.innerHTML=ordersHtml();return}
  if(view==='cus'){v.innerHTML=custHtml();return}
  let l=[...list()];const k=$('#q').value.trim().toLowerCase();
  if(k)l=l.filter(s=>(s.name+' '+s.code).toLowerCase().includes(k));
  if(cat!=='all')l=l.filter(s=>(s.cat||'')===cat);
  if(sz!=='all')l=l.filter(s=>szs(s).includes(sz)&&!isBusy(s,'set',sz,T,T));
  if(view==='free')l=l.filter(s=>freeSizes(s).length);
  l.sort((a,b)=>(b.pin==='Y')-(a.pin==='Y'));
  v.innerHTML=(adm?'<button class="primary" id="addSet" style="margin-bottom:10px">+ เพิ่มชุด</button>':'')+'<div class="grid">'+l.map(cardHtml).join('')+'</div>'+(l.length?'':'<div class="empty">ไม่พบชุด</div>');
}
const side=o=>{$('#side').classList.toggle('on',o);$('#scrim').classList.toggle('on',o)};

function openSet(id){
  const s=sets.find(x=>String(x.id)===String(id));if(!s)return;
  s.views=(+s.views||0)+1;post('view',{id}).catch(()=>{});
  const ps=pics(s);

function calc(){
  const s=f.s;if(!s)return;
  const out=f.area==='out',min=out?OUT_MIN:1;if(f.days<min)f.days=min;
  f.method=out?'ship':(f.method==='ship'?'pickup':f.method);
  const ds=$('#fDate').value,st=ds?dn(ds):0,bs=st-(out?OUT_LEAD:0),be=st+f.days-1+(out?OUT_BACK:IN_BACK);
  $('#gMeth').innerHTML=(out?[['ship','จัดส่งพัสดุ']]:[['pickup','นัดรับที่ร้าน'],['grab','ส่งผ่าน Grab']]).map(m=>`<button data-k="method" data-v="${m[0]}">${m[1]}</button>`).join('');
  if(ds&&isBusy(s,f.part,f.size,bs,be)){const o=szs(s).find(z=>!isBusy(s,f.part,z,bs,be));if(o!==undefined)f.size=o}
  $('#gSize').innerHTML=szs(s).map(z=>{const b=ds&&isBusy(s,f.part,z,bs,be);return `<button data-k="size" data-v="${esc(z)}" ${b?'disabled':''}>${esc(z)||'ฟรีไซส์'}${b?' (ไม่ว่าง)':''}</button>`}).join('');
  $('#days').innerHTML=[1,2,3,4,5].map(d=>`<button data-d="${d}" aria-pressed="${d===f.days}" ${d<min?'disabled':''}>${d}</button>`).join('');
  document.querySelectorAll('#sheet [data-k]').forEach(b=>b.setAttribute('aria-pressed',String(f[b.dataset.k])===b.dataset.v));
  $('#addrBox').style.display=f.method==='pickup'?'none':'block';
  const pr=price(s,f.part,f.days),ship=out?SHIP_FEE:0,total=pr+ship;
  $('#sum').innerHTML=`<div><span>ค่าเช่า ${f.days} วัน</span><span>฿${pr}</span></div>`+(ship?`<div><span>ค่าจัดส่ง</span><span>฿${ship}</span></div>`:'')+(f.method==='grab'?'<div><span>ค่า Grab</span><span>จ่ายตามจริง</span></div>':'')+`<div><span>คืนชุดภายใน</span><span>${ds?fmt(be):'-'}</span></div><div class="t"><span>รวม</span><span>฿${total}</span></div>`;
  let err='';

  else if(!pr)err='ชุดนี้ยังไม่ได้ตั้งราคาสำหรับแบบที่เลือก';else if(isBusy(s,f.part,f.size,bs,be))err='ไม่ว่างในช่วงที่เลือก ลองเปลี่ยนวันหรือไซส์';
  f.o={setId:s.id,part:f.part,size:f.size,area:f.area,method:f.method,start:st,days:f.days,bs,be,total};
  const m=$('#msg');m.className='msg '+(err?'bad':'ok');m.textContent=err||'ว่าง จองได้';$('#save').disabled=!!err;
}

  const od=t.closest('[data-o]');if(od){await post('status',{pin:adm,id:od.dataset.o,status:od.dataset.v});return load()}
  const k=t.closest('#sheet [data-k]');if(k&&!k.disabled){f[k.dataset.k]=k.dataset.v;return calc()}
  const d=t.closest('#days [data-d]');if(d&&!d.disabled){f.days=+d.dataset.d;return calc()}
  if(t.closest('#save'))return submit();
  if(t.closest('#eSave'))return saveEdit();
});
$('#sheet').addEventListener('input',e=>{
  if(e.target.id==='fTel'){e.target.value=e.target.value.replace(/\D/g,'').slice(0,10);if(e.target.value.length<10)$('#cust').textContent=''}
});
$('#sheet').addEventListener('change',async e=>{
  if(e.target.id==='fDate')calc();
  if(e.target.id==='ePhotos'){addPhotos(e.target.files);e.target.value=''}
  if(e.target.id==='fTel'&&/^\d{10}$/.test(e.target.value)){try{const r=await post('lookup',{tel:e.target.value});$('#cust').textContent=r.name?'ลูกค้าเก่า: '+r.name:'ลูกค้าใหม่';if(r.name&&!$('#fName').value)$('#fName').value=r.name}catch(x){}}
});
$('#q').oninput=render;
const store={get(){try{return JSON.parse(localStorage.getItem('nb_sess'))}catch(e){return null}},set(v){try{v?localStorage.setItem('nb_sess',JSON.stringify(v)):localStorage.removeItem('nb_sess')}catch(e){}}};
function setRole(r){loginRole=r;document.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===r)));$('#lcode').placeholder=r==='owner'?'รหัสเจ้าของร้าน':'รหัสลูกค้า'}
function showLogin(msg){$('#login').style.display='flex';$('#lcode').value='';$('#lmsg').textContent=msg||'';$('#lgo').disabled=false}
async function doLogin(role,code){
  try{const r=await post('login',{role,code});
    if(r.err)return r.err+' (ถ้ารหัสถูกต้องแล้วยังไม่ผ่าน ให้ Deploy Apps Script เวอร์ชันใหม่)';
    sess={role,code};store.set(sess);adm=role==='owner'?code:null;view='sets';cat='all';sz='all';
    $('#login').style.display='none';await load();return '';
  }catch(e){return location.hostname.endsWith('github.io')?'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจอินเทอร์เน็ต และเช็กว่า Apps Script Deploy เป็นเวอร์ชันใหม่แล้ว':'หน้านี้เป็นตัวอย่างในแชท เชื่อมต่อระบบจริงไม่ได้ ให้เปิดที่ https://khnon6-create.github.io แทน'}
}
async function submitLogin(){
  const code=$('#lcode').value.trim(),m=$('#lmsg');if(!code){m.textContent='กรอกรหัสก่อน';return}
  m.textContent='กำลังเข้าสู่ระบบ...';$('#lgo').disabled=true;
  const err=await doLogin(loginRole,code);if(err){m.textContent=err;$('#lgo').disabled=false}
}
function logout(){sess=null;adm=null;store.set(null);A={sets:[],orders:[],customers:[]};sets=[];busy=[];$('#ov').classList.remove('on');side(false);render();showLogin()}
$('#lcode').addEventListener('keydown',e=>{if(e.key==='Enter')submitLogin()});
function boot(){
  $('#lbrand').textContent=BRAND;setRole('cust');render();
  const s=store.get();
  if(s&&s.code){$('#lmsg').textContent='กำลังเข้าสู่ระบบ...';setRole(s.role);doLogin(s.role,s.code).then(m=>{if(m){store.set(null);showLogin(m)}})}
}
boot();
</script>
</body>
</html>
