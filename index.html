<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบจองเช่าชุด</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f4;--card:#fff;--ink:#2a1a22;--mute:#7d6a73;--line:#eadfe2;--wine:#8a2f55;--wine2:#6e2243;--ok:#2e7d5b;--bad:#b3342f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1217;--card:#27191f;--ink:#f6e9ee;--mute:#b79ba7;--line:#3b2831;--wine:#d0668f;--wine2:#b44f78;--ok:#55c394;--bad:#ff8a84}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Prompt,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.layout{display:flex;min-height:100vh}
aside{width:230px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
main{flex:1;min-width:0}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.brand{font-size:20px;font-weight:600;color:var(--wine);padding:4px 8px 12px}
.nh{font-size:12px;color:var(--mute);margin:14px 8px 4px}
.nv{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:9px 10px;border-radius:10px}
.nv small{color:var(--mute)}
.nv[aria-pressed=true]{background:var(--wine);color:#fff}.nv[aria-pressed=true] small{color:#fff}
#menuBtn{display:none}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:380px}
.lbox .brand{text-align:center;font-size:26px}.lbox p{text-align:center;margin:0 0 12px}
#ownerBar{display:none;margin:12px 0 0;padding:12px;border:2px solid var(--wine);border-radius:14px;background:var(--card)}
#ownerBar b{display:block;margin-bottom:8px;color:var(--wine)}
#ownerBar .r{display:flex;gap:8px;flex-wrap:wrap}#ownerBar .r button{flex:1 1 30%}
#ownerBar .big{width:100%;font-size:17px;padding:14px;margin-bottom:8px}
#fab{display:none;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:30px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.qrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:19}
@media(max-width:759px){
 aside{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:20;transform:translateX(-100%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
 aside.on{transform:none}#scrim.on{display:block}#menuBtn{display:inline-block}
}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hl{display:flex;align-items:center;gap:10px}
h1{font-size:20px;margin:0;font-weight:600}h1 small{font-size:12px;color:var(--mute);font-weight:400}.sub{color:var(--mute);font-size:13px}
.primary{background:var(--wine);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:500}.primary:disabled{opacity:.4}
.lite{background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:6px 10px;font-size:13px}
#q{margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0;color:inherit}.item.off{opacity:.5}
.pic{aspect-ratio:3/4;position:relative;background:linear-gradient(#f5ece9,#efe3df);display:flex;align-items:center;justify-content:center}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.noimg{color:#a89096;font-size:13px}
.badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px}
.cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:10px;padding:1px 8px}
.b{background:var(--wine2);color:#fff;font-size:11px;border-radius:10px;padding:1px 8px;width:max-content}
.info{padding:10px 12px}.name{font-weight:600}.code{color:var(--mute);font-size:12px}
.szs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sz{font-size:12px;border:1px solid var(--ok);color:var(--ok);border-radius:8px;padding:0 8px}
.sz.out{border-color:var(--line);color:var(--mute);text-decoration:line-through;opacity:.7}
.row{display:flex;justify-content:space-between;align-items:end;margin-top:6px}
.price{color:var(--wine);font-weight:600;font-size:17px}.price small{color:var(--mute);font-weight:400;font-size:11px;display:block}
.st{font-size:12px;border-radius:10px;padding:2px 8px}.free{background:#e3f4ec;color:var(--ok)}.busy{background:#fbe6e4;color:var(--bad)}
.bk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.bk.cx{opacity:.55}
.bk h3{margin:0 0 4px;font-size:15px}.bk p{margin:2px 0;color:var(--mute);font-size:13px}.acts{display:flex;gap:8px;margin-top:8px}
.ghost{background:none;border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:8px 12px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin-bottom:6px}
.gal img{flex:none;width:100%;max-height:380px;object-fit:cover;border-radius:12px;scroll-snap-align:center}
.gh{font-size:12px;color:var(--mute);margin-bottom:8px;text-align:center}
.pt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0;text-align:center;font-size:13px}
.pt div{background:var(--bg);border-radius:10px;padding:6px 2px}.pt b{display:block;font-weight:500;color:var(--mute);font-size:12px}.pt span{color:var(--wine);font-weight:600}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg button,.days button{flex:1 1 28%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px}
.seg button[aria-pressed=true],.days button[aria-pressed=true]{background:var(--wine);color:#fff;border-color:var(--wine)}
.seg button:disabled,.days button:disabled{opacity:.3}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sum{background:var(--bg);border-radius:12px;padding:12px;margin-top:14px;font-size:14px}
.sum div{display:flex;justify-content:space-between}.sum .t{font-weight:600;font-size:17px;color:var(--wine);margin-top:6px}
.msg{margin-top:10px;font-size:13px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.x{float:right;background:none;border:0;font-size:24px;color:var(--mute)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.pth{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.pth img{width:100%;height:100%;object-fit:cover}
.pth button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;line-height:1;padding:0}
.pth i{position:absolute;left:3px;bottom:3px;background:var(--wine);color:#fff;font-size:10px;font-style:normal;border-radius:6px;padding:0 5px}
.padd{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--mute);cursor:pointer;margin:0}
.padd input{display:none}
.done{text-align:center;padding:20px 0}.done .ic{font-size:54px}
</style>
</head>
<body>
<div class="layout">
  <aside id="side"></aside>
  <main><div class="wrap">
    <header>
      <div class="hl"><button class="lite" id="menuBtn" aria-label="เมนู">☰ เมนู</button><div><h1 id="title"></h1><div class="sub" id="today"></div></div></div>
      <button class="lite" id="admBtn">เจ้าของร้าน</button>
    </header>
    <div id="ownerBar"></div>
    <input id="q" placeholder="ค้นหาชื่อหรือรหัสชุด">
    <div id="view"></div>
    <div class="sub" style="text-align:center;margin:24px 0 8px">เวอร์ชัน 7 · 11 ต.ค. 2569</div>
  </div></main>
</div>
<div id="login"><div class="lbox"><div class="brand" id="lbrand"></div><p class="sub">เลือกประเภทการเข้าใช้งาน</p>
  <div class="seg"><button data-role="cust">👤 ลูกค้า</button><button data-role="owner">🏪 เจ้าของร้าน</button></div>
  <label for="lcode">รหัสเข้าใช้งาน</label><input id="lcode" type="password" inputmode="numeric" autocomplete="off">
  <div class="msg bad" id="lmsg"></div><button class="primary" id="lgo" style="width:100%;margin-top:14px">เข้าสู่ระบบ</button></div></div>
<div id="scrim"></div>
<button class="primary" id="fab" data-add>+ เพิ่มสินค้าใหม่</button>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwX5GXdSZOHyunymQqALuhPFLjzwjyPS1GuQbE4PyC2fydYnGneB-y9Xm0xGQT2USkMaA/exec';
const BRAND='Nuea Brand';                             // <<< ชื่อแบรนด์/ร้าน แก้ตรงนี้ได้
const CATS=['ชุดคาเฟ่','ชุดราตรี','ชุดไทย','ชุดทำงาน','อื่นๆ']; // <<< แก้หมวดหมู่ได้ตามต้องการ
const SHIP_FEE=60,OUT_MIN=2,OUT_LEAD=2,OUT_BACK=2,IN_BACK=1;
const $=s=>document.querySelector(s);
const dn=s=>{const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)/864e5};
const iso=n=>new Date(n*864e5).toISOString().slice(0,10);
const fmt=n=>new Date(n*864e5).toLocaleDateString('th-TH',{day:'numeric',month:'short',timeZone:'UTC'});
const now=new Date(),todayStr=new Date(now-now.getTimezoneOffset()*6e4).toISOString().slice(0,10),T=dn(todayStr);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post=(a,d)=>fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({a,code:sess&&sess.code,...d})}).then(r=>r.json());
let sess=null,loginRole='cust',sets=[],busy=[],adm=null,A={sets:[],orders:[],customers:[]},view='sets',cat='all',sz='all',f={};
const ov=(p,q)=>p==='set'||q==='set'||p===q;
const szs=s=>{const a=String(s.sizes||'').split(',').map(x=>x.trim()).filter(Boolean);return a.length?a:['']};
const qmap=s=>{const m={
