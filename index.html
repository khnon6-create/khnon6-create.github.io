<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบจองเช่าชุด</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf8e8;--card:#fffdf4;--ink:#4a2c14;--mute:#8a6d4f;--line:#ecdfae;--wine:#2f6b4a;--wine2:#24543a;--ok:#2e7d5b;--bad:#b3342f;--yel:#fadb6f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Prompt,system-ui,sans-serif}
h1{font-size:20px;margin:0;font-weight:600}h1 small{font-size:12px;color:var(--mute);font-weight:400}.sub{color:var(--mute);font-size:13px}
button{font:inherit;cursor:pointer}
.primary{background:var(--yel);color:#3b2418;border:2px solid #3b2418;border-radius:14px;padding:10px 16px;font-weight:600}.primary:disabled{opacity:.4}
.lite{background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:6px 10px;font-size:13px}
.lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lc{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px;width:100%;max-width:400px;text-align:center}
.lc .seg{margin-top:12px}.lc label{text-align:left}
.app{display:flex;min-height:100vh}
aside{width:215px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside h2{margin:0 8px 14px;font-size:18px;color:var(--wine)}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 12px;color:var(--ink);margin-bottom:2px}
.nav button[aria-pressed=true]{background:var(--wine);color:#fff}.nav hr{border:0;border-top:1px solid var(--line);margin:10px 0}
main{flex:1;min-width:0;padding:16px;max-width:900px}
#menu{display:none;margin-bottom:10px}
@media(max-width:700px){aside{position:fixed;left:0;top:0;z-index:8;transform:translateX(-100%);transition:transform .2s}aside.on{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}#menu{display:inline-block}}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.bar{grid-template-columns:1fr}}
.bar label{margin:0}.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 14px}
.tab[aria-pressed=true]{background:var(--wine);color:#fff;border-color:var(--wine)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0;color:inherit}.item.off{opacity:.5}
.pic{aspect-ratio:3/4;position:relative;background:linear-gradient(#f5ece9,#efe3df);display:flex;align-items:center;justify-content:center}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.noimg{color:#a89096;font-size:13px}
.badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px}
.b{background:var(--wine2);color:#fff;font-size:11px;border-radius:10px;padding:1px 8px;width:max-content}
.info{padding:10px 12px}.name{font-weight:600}.code{color:var(--mute);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:end;margin-top:6px;gap:6px}
.price{color:var(--wine);font-weight:600;font-size:17px}.price small{color:var(--mute);font-weight:400;font-size:11px;display:block}
.st{font-size:12px;border-radius:10px;padding:2px 8px}.free{background:#e3f4ec;color:var(--ok)}.busy{background:#fbe6e4;color:var(--bad)}
.zs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.z{font-size:12px;border-radius:8px;padding:0 8px;border:1px solid var(--ok);color:var(--ok)}.z.out{border-color:var(--line);color:var(--mute);text-decoration:line-through}
.bk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.bk.cx{opacity:.55}
.bk h3{margin:0 0 4px;font-size:15px}.bk p{margin:2px 0;color:var(--mute);font-size:13px}.acts{display:flex;gap:8px;margin-top:8px}
.ghost{background:none;border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:8px 12px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:10px}.gal img{flex:none;width:85%;max-height:380px;object-fit:cover;border-radius:12px;scroll-snap-align:center}
.pt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0;text-align:center;font-size:13px}
.pt div{background:var(--bg);border-radius:10px;padding:6px 2px}.pt b{display:block;font-weight:500;color:var(--mute);font-size:12px}.pt span{color:var(--wine);font-weight:600}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg button,.days button{flex:1 1 28%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px}
.seg button[aria-pressed=true],.days button[aria-pressed=true]{background:var(--wine);color:#fff;border-color:var(--wine)}
.seg button:disabled,.days button:disabled{opacity:.3}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sum{background:var(--bg);border-radius:12px;padding:12px;margin-top:14px;font-size:14px}
.sum div{display:flex;justify-content:space-between}.sum .t{font-weight:600;font-size:17px;color:var(--wine);margin-top:6px}
.msg{margin-top:10px;font-size:13px}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.x{float:right;background:#0001;border:0;border-radius:50%;width:48px!important;height:48px;font-size:30px;line-height:1;color:var(--ink,#333);padding:0!important;display:flex;align-items:center;justify-content:center}
.eph{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.eph .t{aspect-ratio:1;position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.eph img{width:100%;height:100%;object-fit:cover}.eph .t button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:22px;height:22px;line-height:20px;padding:0}
.eph .add{font-size:28px;color:var(--wine);cursor:pointer}
.logo{display:block;margin:0 auto 6px;max-width:100%;border-radius:18px}.lc .logo{width:220px}aside .logo{width:140px}
.pic{background:linear-gradient(#fff7d6,#fbeab0)!important}
.ok2{text-align:center;padding:10px 0}.ok2 .big{font-size:52px}
.po{margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:center}.po img{display:block;margin:0 auto;max-width:100%}.po.v img{max-height:560px}.po b{display:block;padding:8px}

.car{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 0 8px;-webkit-overflow-scrolling:touch}.car img{height:220px;width:auto;max-width:85%;object-fit:cover;border-radius:12px;scroll-snap-align:start;flex:none}
.slipimg{max-width:100%;max-height:360px;border-radius:10px;display:block;margin:6px 0}.lk{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--wine)}
.okb{background:var(--ok);color:#fff;border-radius:10px;padding:2px 10px;font-size:12px}.pr{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pr button{flex:1 1 40%;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}.pr button[aria-pressed=true]{background:var(--wine);color:#fff}

.payb{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;text-align:center}.qr{width:220px;max-width:70%;border-radius:10px;margin:8px auto;display:block}.acc{display:flex;flex-direction:column;gap:2px;margin:6px 0 10px}.acc b{font-size:22px;color:var(--wine);letter-spacing:1px}
main{position:relative}#deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}.st{position:absolute;display:flex;align-items:center;justify-content:center;line-height:1;user-select:none}.st img{width:100%;height:100%;object-fit:contain}.st.ed{pointer-events:auto;touch-action:none;outline:1px dashed var(--wine)}.st.sel{outline:2px solid var(--wine)}
#stOn{position:fixed;right:14px;bottom:14px;width:auto;z-index:30}.dtp{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px}.em{display:flex;gap:6px;overflow-x:auto}.em button,.em label{width:auto;flex:none;padding:6px 12px;font-size:20px}.pf{display:inline-block;margin:6px 0}
body.pop h1,body.pop h2,body.pop h3{font-weight:800;color:var(--wine)}body.pop aside{background:#d6f2ec}body.pop .primary{border-radius:999px}body.pop .item,body.pop .bk,body.pop .po,body.pop .lc{border-radius:28px;border:2px solid #fff;box-shadow:0 6px 0 #ffc2dc}
body.pop main::before{content:"";display:block;height:20px;margin:-16px -16px 12px;background:radial-gradient(circle at 12px 0,transparent 11px,var(--wine) 12px) 0 0/24px 20px repeat-x}
.bn{margin:0;font-size:13px;color:var(--wine)}
.ni{width:1.25em;height:1.25em;object-fit:contain;vertical-align:-4px;border-radius:5px}

.app{display:block}aside{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s;height:100vh}aside.on{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}#menu{display:inline-block!important;margin:0}
main{margin:0 auto;max-width:1000px}.top{position:sticky;top:0;z-index:7;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 0;margin:0 0 8px;border-bottom:1px solid var(--line)}.top button{width:auto;padding:8px 14px}.top .brand{font-weight:800;font-size:20px;color:var(--wine);margin:0}.top .logo{width:auto!important;height:34px!important;border-radius:8px}
.eye{position:absolute;right:8px;bottom:8px;z-index:2;background:#fff;border-radius:999px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.25)}
#lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:flex;align-items:center}.lbc{height:88vh;width:100%;margin:0}.lbc img{height:100%;max-width:92%;width:auto;object-fit:contain;flex:none;scroll-snap-align:center}#lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:auto;z-index:2}
.po{margin:0!important;border:0!important;border-radius:0!important;background:none!important;box-shadow:none!important}.po img{width:100%;max-height:none!important}

#menu{font-size:30px!important;padding:10px 18px!important;min-width:56px;min-height:52px;line-height:1}.top .logo{height:56px!important}.top .brand{font-size:26px}#tSearch{font-size:24px!important;min-height:52px}
.r2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}.r2 .price{text-align:right;margin-left:auto}.r2 .zs{justify-content:flex-end;margin:0}
.sb{font-size:13px;border-radius:999px;padding:2px 12px;background:transparent;white-space:nowrap}.sb.free{color:#2e7d5b;border:1.5px solid #2e7d5b}.sb.busy{color:#c0392b;border:1.5px solid #c0392b}.item .name{font-size:20px;font-weight:800}.r2 .price{font-size:28px;font-weight:800;line-height:1}.eye{width:44px;height:44px;font-size:22px}#tCart{font-size:24px!important;min-height:52px}.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:#2e7d5b;color:#fff;padding:12px 20px;border-radius:999px;z-index:99;font-weight:700}#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}#fx span{position:absolute;top:-40px;animation:fall linear infinite}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}@keyframes rise{to{transform:translateY(-110vh) translateX(40px) rotate(25deg)}}
#lb{flex-direction:column;justify-content:center}.lbw{overflow:auto;width:100%;height:86vh;display:flex;align-items:flex-start;justify-content:center}.lbw img{margin:auto}.lbb{position:absolute;top:50%;transform:translateY(-50%);width:52px!important;height:52px;border-radius:50%;font-size:30px;padding:0!important;z-index:2}.lbb.l{left:8px}.lbb.r{right:8px}.lbt{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;color:#fff;z-index:2}.lbt button{width:48px!important;height:48px;border-radius:50%;padding:0!important;font-size:22px}
.grid .name{font-size:14px;line-height:1.25}.grid .r2{gap:4px;margin-top:4px}.grid .bn{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.grid .r2 .price{font-size:18px}.grid .sub{font-size:11px}.grid .sb{font-size:10px;padding:1px 7px}.grid .z{font-size:10px;padding:0 5px;min-width:0}.grid .zs{gap:3px}.grid .eye{width:30px;height:30px;font-size:15px}.grid .st{font-size:10px;padding:2px 7px}.grid .code{font-size:11px}</style>
</head>

<div class="lg" id="login"><div class="lc">
  <img class="logo" alt="logo"><h1 id="lgBrand"></h1><div class="sub" style="margin-top:14px">เลือกประเภทการเข้าใช้งาน</div>
  <div class="seg" id="lgRole"><button data-r="cus" aria-pressed="true">👤 ลูกค้า</button><button data-r="own" aria-pressed="false">🏬 เจ้าของร้าน</button></div>
  <div id="lgNameBox"><label for="lgName">ชื่อของคุณ</label><input id="lgName" maxlength="40" autocomplete="off"></div><label for="lgPw">รหัสเข้าใช้งาน</label><input id="lgPw" type="password" inputmode="numeric" autocomplete="off">
  <div class="msg bad" id="lgMsg"></div>
  <button class="primary" id="lgGo" style="width:100%;margin-top:14px">เข้าสู่ระบบ</button>
  <div class="sub" style="margin-top:10px;font-size:11px;opacity:.6">v.16</div>
</div></div>

<div class="app" id="app" hidden>
  <aside id="side"><img class="logo" alt="logo"><h2 class="brand" style="text-align:center"></h2><nav class="nav" id="nav"></nav></aside>
  <main>
    <div class="top"><button class="lite" id="menu">☰</button><img class="logo" alt=""><b class="brand"></b><span style="flex:1"></span><button class="lite" id="tCart">🛒<span id="cn"></span></button><button class="lite" id="tSearch">🔍</button></div>
    <div class="sub" id="today"></div>
    <div id="bar"><div class="bar"><label>วันที่ต้องการเช่า<input type="date" id="vd"></label><label>ค้นหา<input id="q" placeholder="ชื่อหรือรหัสชุด"></label></div><div class="tabs" id="szTabs"></div></div>
    <div id="view"></div>
  </main>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

function render(){
  const nav=[['home','','🏠 หน้าหลัก'],['shop','all','🛍 ทั้งหมด'],...cats().map(c=>['shop',c,c,icOf(c)]),['shop','__set','🧥 ทั้งเซ็ต'],['shop','__split','✂️ แยกเซ็ต']];
  if(adm())nav.push(['-'],['ord','','📋 ออเดอร์'],['cus','','👥 ลูกค้า'],['roi','','💰 คืนทุน'],['promo','','🎁 โปรโมชั่น'],['wipe','','🧹 ล้างข้อมูลทดสอบ'],['usr','','🔑 บัญชีลูกค้า'],['theme','','🎨 ธีมร้าน']);else nav.push(['-'],['mine','','📦 การจองของฉัน']);

  $('#szTabs').innerHTML=['',...allSz].map(z=>`<button class="tab" data-z="${esc(z)}" aria-pressed="${sz===z}">${z?'ไซส์ '+esc(z):'ทุกไซส์'}</button>`).join('');

  if(tab==='ord')return v.innerHTML=ordersHtml();if(tab==='mine')return v.innerHTML=mineHtml();if(tab==='theme')return v.innerHTML=themeHtml();
  if(tab==='cus')return v.innerHTML=custHtml();if(tab==='roi')return v.innerHTML=roiHtml();if(tab==='promo')return v.innerHTML=promoHtml();if(tab==='wipe')return v.innerHTML=wipeHtml();
  let l=list().filter(s=>cat==='all'||(cat==='__set'?+s.pcs>=2:cat==='__split'?canSplit(s):s.cat===cat));
  const k=$('#q').value.trim().toLowerCase();

}

  if(!isOpen)return;const M=document.getElementById('chM');
  try{
    if(own()&&!cur){document.getElementById('chT').textContent='แชทลูกค้า';document.getElementById('chK').style.display='none';document.getElementById('chF').style.display='none';
      const r=await post('threads',{});M.innerHTML=(r.threads||[]).map(t=>`<div class="th" data-u="${E(t.user)}"><b>${E(t.user)}</b><span>${E(t.text).slice(0,60)}</span></div>`).join('')||'<p style="text-align:center;opacity:.6">ยังไม่มีแชท</p>';return}
    const u=cur||who();document.getElementById('chT').textContent=own()?u:'💬 ถามร้าน';document.getElementById('chK').style.display=own()?'block':'none';document.getElementById('chF').style.display='flex';document.getElementById('chA').style.display=own()?'none':'inline';
    const r=await post('myMsgs',{user:u}),a=r.msgs||[];
    const bot=a.length?'':'<div class="cm bot"><small>🤖 น้องบอท</small>สวัสดีค่ะ ถามเรื่องชุด ราคา ไซส์ หรือขั้นตอนการเช่าได้เลยนะคะ 😊</div>';
    const near=M.scrollHeight-M.scrollTop-M.clientHeight<80;M.innerHTML=bot+a.map(bub).join('');if(near||!M.dataset.s){M.scrollTop=M.scrollHeight;M.dataset.s=1}
  }catch(e){}
}
async function send(){
  const I=document.getElementById('chI'),G=document.getElementById('chG'),fl=G.files[0],x=I.value.trim();if((!x&&!fl)||busy)return;busy=true;I.value='';G.value='';
  const M=document.getElementById('chM');M.insertAdjacentHTML('beforeend',bub({from:own()?'owner':'user',text:x||'📷 ส่งรูปภาพ'})+(own()?'':'<div class="cm bot" id="chW"><small>🤖 น้องบอท</small>กำลังพิมพ์...</div>'));M.scrollTop=M.scrollHeight;
  try{const r=await post(own()?'ownerReply':'chat',{user:cur||who(),text:x,img:fl&&!own()?await shrink(fl,1000):''});if(r.err)alert(r.err)}catch(e){alert('ส่งไม่สำเร็จ ลองใหม่อีกครั้ง')}
  busy=false;load();
}
B.onclick=()=>{isOpen=!isOpen;P.style.display=isOpen?'flex':'none';cur='';document.getElementById('chM').dataset.s='';if(isOpen){load();tm=setInterval(()=>{if(!busy)load()},8000)}else clearInterval(tm)};
document.getElementById('chX').onclick=()=>B.onclick();
document.getElementById('chK').onclick=()=>{cur='';document.getElementById('chM').dataset.s='';load()};
document.getElementById('chS').onclick=send;document.getElementById('chI').onkeydown=e=>{if(e.key==='Enter')send()};
document.getElementById('chM').onclick=e=>{const t=e.target.closest('.th');if(t){cur=t.dataset.u;document.getElementById('chM').dataset.s='';load()}};
})();
</script>
